<!DOCTYPE html>
<html>

<head>
  <title>Edit review</title>
</head>

<body>
  <h1>Edit review</h1>
  <form action="/update_item" method="post">
    <p>
      Title: <br />
      <input type="text" name="title" value="{{ review.title }}" />
    </p>
    <p>
      Add a review: <br />
      <textarea name="body" rows="8" cols="40">{{ review.body }}</textarea>
    </p>
    <input type="hidden" name="review_id" value="{{ review.id }}" />
    <input type="submit" value="Save changes" /> 
    <p>

    </p>
  </form>
</body>

</html>
