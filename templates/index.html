<!DOCTYPE html>
<html>

<head>
  <title>Movie review website</title>
</head>

<body>
  <h1> Movie review website </h1>
  {% if session.username %}
  <p>
    Olet kirjautunut nimellä {{ session.username }}, id-numerosi on {{ session.user_id }}
  </p>
  <p>
    <a href="/logout">Kirjaudu ulos</a>
  </p>
  {% endif %}
  <p>
    <a href="/login">Login</a>
    <a href="/register">Register</a>
    <a href="/new_item">New review</a>
  </p>
  <h2> Reviews </h2>
</body>

</html>
