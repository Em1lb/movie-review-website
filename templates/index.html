<!DOCTYPE html>
<html>

<head>
  <title>Movie review website</title>
</head>

<body>
  <h1> Movie review website </h1>
  {% if session.username %}
  <p>
    You're logged in as {{ session.username }}, your id is {{ session.user_id }}
  </p>
  <p>
    <a href="/logout">Log out</a>
  </p>
  {% endif %}
  <p>
    <a href="/login">Login</a>
    <a href="/register">Register</a>
    <a href="/new_item">New review</a>
  </p>
  <h2> Reviews </h2>
  
  <ul>
    {% for review in reviews %}
    <li><a href="review/{{ review.id }}">{{ review.title }}</li>    
    {% endfor %}
  </ul>
</body>

</html>
