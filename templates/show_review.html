<!DOCTYPE html>
<html>

<head>
  <title>{{ review.title }}</title>
</head>

<body>
  <h1>{{ review.title }}</h1>
  {% if session.user_id == review.user_id %}
  <p>
    <a href="/edit_review/{{ review.id }}">Edit</a>
    <a href="/remove_review/{{ review.id }}">Remove</a>
  </p>
  {% endif %}
  <p>
    {{ review.body }}
  </p>
  <p>
    Review by {{ review.username }}
  </p>
  <p>
    <a href="/">Return</a>
  </p>
</body>
</html>
